<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>NEXUS</title>

<!-- NEXUS by Muhammed Thameem KT -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&family=Geist+Mono:wght@300&display=swap');
:root{
  --violet:#5227FF;--pink:#FF9FFC;--ink:#f4f1ff;--dim:rgba(244,241,255,.55);
  --glass:rgba(255,255,255,.07);--glass-strong:rgba(18,12,40,.55);
  --edge:rgba(255,255,255,.18);--ok:#22c55e;--err:#ef4444;
  --blur:blur(22px) saturate(180%);
  --shine:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 24px rgba(255,255,255,.04),0 10px 40px rgba(5,0,30,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05030f;color:var(--ink);font-family:'Sora',system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#bg-dim{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(3,2,12,.55),rgba(3,2,12,.25) 60%,rgba(3,2,12,.5));pointer-events:none}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--shine)}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:relative;z-index:1;height:var(--vh,100dvh);display:flex}
#col{flex:1;min-width:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 0}
#header{margin:12px 12px 0;padding:8px 10px 8px 8px;border-radius:22px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.ibtn{width:40px;height:40px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;transition:background .2s,transform .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ibtn:hover{background:rgba(255,255,255,.14)}.ibtn:active{transform:scale(.94)}.ibtn:disabled{opacity:.35;cursor:not-allowed}
.burger{display:grid;gap:4px}.burger i{display:block;width:16px;height:2px;background:var(--ink);border-radius:2px}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:.32em;flex:1}
#status{font-size:.68rem;color:var(--dim);display:flex;align-items:center;gap:6px}
#status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill{border:1px solid var(--edge);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 12px;font-size:.68rem;white-space:nowrap}
.pill.on{color:var(--ok);border-color:var(--ok);box-shadow:0 0 14px rgba(34,197,94,.35)}
#chat{flex:1;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.msg{display:flex;flex-direction:column;max-width:min(760px,88%);animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg.user{align-self:flex-end}.msg.assistant{align-self:flex-start}
.who{font-size:.62rem;color:var(--dim);margin:0 6px 4px;letter-spacing:.08em}
.msg.user .who{text-align:right}
.bubble{padding:12px 16px;border-radius:22px;line-height:1.7;font-size:.88rem;white-space:pre-wrap;word-break:break-word;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.msg.user .bubble{background:linear-gradient(135deg,rgba(82,39,255,.45),rgba(255,159,252,.22));border-radius:22px 22px 6px 22px}
.msg.assistant .bubble{border-radius:22px 22px 22px 6px}
.bubble.sel{user-select:text;-webkit-user-select:text}
.msg.pressing .bubble{transform:scale(.985);transition:transform .35s}
.bubble strong{color:#fff}.bubble em{color:var(--pink);font-style:normal}
.bubble h1,.bubble h2,.bubble h3{font-size:.95rem;margin:10px 0 4px}
.bubble ul,.bubble ol{padding-left:1.3em;margin:6px 0}
.bubble a{color:var(--pink)}
.bubble blockquote{border-left:3px solid var(--pink);padding-left:10px;color:var(--dim);margin:6px 0}
.bubble hr{border:none;border-top:1px solid var(--edge);margin:10px 0}
.bubble code{font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;font-size:.82em}
.code-wrap{position:relative;margin:10px 0;border-radius:16px;overflow:hidden;background:rgba(5,3,20,.65);border:1px solid var(--edge)}
.code-wrap pre{white-space:pre;overflow-x:auto;padding:38px 14px 14px;font-family:'JetBrains Mono',monospace;font-size:.76rem;line-height:1.55;user-select:text;-webkit-user-select:text}
.code-wrap pre code{background:none;padding:0}
.code-bar{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.code-bar button{font-size:.62rem;padding:4px 10px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.1)}
.code-bar button:hover{background:rgba(255,255,255,.22)}
.code-bar .run{background:var(--violet);border-color:var(--violet)}
.foot{margin:6px 8px 0}
.edit-box{width:100%;min-width:min(520px,70vw);background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--edge);border-radius:14px;padding:10px;font:inherit;font-size:.86rem;resize:vertical;min-height:70px;outline:none}
.edit-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.edit-row button{padding:6px 14px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.1);font-size:.72rem}
.edit-row .go{background:var(--violet);border-color:var(--violet)}
.lat{display:inline-flex;align-items:center;gap:10px;font-size:14px}
.lat-grid{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.lat-grid i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.15;transition:opacity .09s}
.lat-grid i.on{opacity:1}
.lat.done{color:#22c55e}.lat.error{color:#ef4444}.lat.done .lat-grid i,.lat.error .lat-grid i{opacity:1}
.lat.working{color:var(--ink)}
.lat .t{font-variant-numeric:tabular-nums;opacity:.7}
.thinking{align-self:flex-start;padding:12px 16px;border-radius:18px}

#pb-wrap{padding:0 12px max(8px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;flex-shrink:0}
.prompt-bar{--pb-spark:#b39dff;--pb-hover:rgba(255,255,255,.1);position:relative;width:min(760px,100%);font-size:14px;line-height:22px}
.pb-field{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:22px;cursor:text;overflow:hidden}
.pb-field::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(140% 120% at 0% 100%,rgba(179,157,255,.3),transparent 62%);opacity:0;transition:opacity .5s;pointer-events:none}
.pb-field[data-max]::before{opacity:1}
#pb-sparks{position:absolute;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.pb-chips{display:flex;flex-wrap:wrap;gap:6px}.pb-chips:empty{display:none}
.pb-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 9px;border-radius:9px;background:var(--pb-hover);font-size:12px;animation:in .2s ease}
.pb-cn{max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pb-chip button{width:18px;height:18px;border:0;border-radius:5px;background:transparent;font-size:10px;opacity:.6}.pb-chip button:hover{background:var(--pb-hover);opacity:1}
#input{display:block;width:100%;background:transparent;border:0;color:var(--ink);font:inherit;font-size:.9rem;line-height:22px;resize:none;outline:none;min-height:22px;max-height:110px;overflow-wrap:anywhere}
#input::placeholder{color:var(--dim)}
@media(pointer:coarse){#input{font-size:16px}}
.pb-bar{display:flex;align-items:center;gap:4px}
.pb-tool,.pb-pick,.pb-send{flex:none;border:0;background:transparent;font:inherit;cursor:pointer;outline:none;user-select:none;touch-action:manipulation;transition:background .15s,color .15s,transform .16s}
.pb-tool{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;font-size:1.05rem;color:rgba(244,241,255,.65)}
.pb-pick{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border-radius:9px;font-size:12px;font-weight:600;color:rgba(244,241,255,.75)}
.pb-tool:hover,.pb-pick:hover,.pb-tool[data-on],.pb-pick[data-on]{background:var(--pb-hover);color:var(--ink)}
.pb-tool:active,.pb-send:active{transform:scale(.94)}.pb-tool:disabled{opacity:.35;cursor:not-allowed}
.pb-tool.rec{background:var(--pink);color:#1a0a2a}
.prompt-bar[data-max] .pb-pick{color:var(--pb-spark)}
.pb-send{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;background:rgba(255,255,255,.14);color:rgba(255,255,255,.5)}
.pb-send[data-armed]{background:#f4f1ff;color:#120a2a}
.pb-send svg{width:16px;height:16px;display:block}
.pb-menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:5;padding:4px;border-radius:18px;background:var(--glass-strong);animation:in .18s ease}
.pb-menu[hidden]{display:none}
.pb-menu[data-kind=effort]{right:auto;width:248px;padding:12px 14px 14px}
.pb-row{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border:0;border-radius:12px;background:transparent;text-align:left;font-size:.8rem}
.pb-row.on{background:var(--pb-hover)}.pb-row small{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--dim);font-size:.72rem}
.pb-ic{width:20px;text-align:center}.pb-empty{padding:10px;font-size:.75rem;color:var(--dim)}
.pb-eh{display:flex;gap:8px;font-size:13px}.pb-ee{display:flex;justify-content:space-between;margin-top:12px;color:var(--dim);font-size:12px}
.pb-track{position:relative;height:22px;margin-top:8px;border-radius:11px;background:var(--pb-hover);cursor:pointer;outline:none;touch-action:none;user-select:none}
.pb-fill{position:absolute;top:0;bottom:0;left:0;width:var(--f);border-radius:11px;background:rgba(255,255,255,.18);transition:width .22s,background .3s}
.pb-dot{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.3)}
.pb-thumb{position:absolute;top:-3px;left:var(--x);width:14px;height:28px;margin-left:-7px;border-radius:7px;background:#f4f1ff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .22s,background .3s}
.prompt-bar[data-max] .pb-fill{background:rgba(179,157,255,.35)}.prompt-bar[data-max] .pb-thumb{background:var(--pb-spark)}
.sw{justify-content:space-between}
.knob{width:38px;height:22px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;flex-shrink:0;transition:background .2s}
.knob::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on .knob{background:var(--ok)}.sw.on .knob::after{transform:translateX(16px)}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(2,1,10,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.show{opacity:1;pointer-events:auto}
#side{position:fixed;z-index:21;top:10px;bottom:10px;left:10px;width:270px;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:16px;transform:translateX(-120%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:var(--glass-strong)}
#side.open{transform:none}
.side-top{display:flex;align-items:center;justify-content:space-between}
.side-top b{letter-spacing:.3em;font-size:1rem}
.sec{display:grid;gap:6px}.sec h4{font-size:.62rem;font-weight:400;color:var(--dim);letter-spacing:.12em;margin:0 4px 2px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;border:1px solid transparent;background:transparent;font-size:.8rem;text-align:left;transition:background .2s}
.opt:hover{background:rgba(255,255,255,.08)}
.opt.active{background:rgba(255,255,255,.12);border-color:var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.stats{margin-top:auto;display:grid;gap:6px;font-size:.7rem;color:var(--dim);padding:0 6px}
.stats div{display:flex;justify-content:space-between}.stats b{color:var(--ink);font-weight:400}
#runner{width:0;overflow:hidden;transition:width .35s cubic-bezier(.2,.8,.2,1);flex-shrink:0;display:flex}
#runner.open{width:48%;min-width:340px}
.run-in{margin:12px 12px 12px 0;flex:1;min-width:0;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;background:var(--glass-strong)}
.run-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--edge)}
.run-bar b{flex:1;font-size:.78rem;font-weight:600}
#frame{flex:1;border:0;background:#fff;border-radius:0 0 26px 26px}
#menu{position:fixed;z-index:50;display:none;min-width:170px;padding:6px;border-radius:20px;background:var(--glass-strong)}
#menu.show{display:block;animation:in .15s}
#menu button{display:flex;gap:10px;width:100%;background:none;border:none;padding:10px 12px;border-radius:14px;font-size:.8rem;text-align:left}
#menu button:hover{background:rgba(255,255,255,.12)}
#voice{position:fixed;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(3,2,14,.55);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .3s}
#voice.show{opacity:1}
#strands{width:100%;height:min(46vh,420px)}
#voice p{font-size:.85rem;letter-spacing:.14em;color:var(--dim);min-height:1.4em;padding:0 24px;text-align:center}
#welcome{margin:auto;text-align:center;padding:24px;display:grid;gap:14px;justify-items:center}
#welcome h1{font-size:clamp(2rem,9vw,3.4rem);letter-spacing:.4em;margin-right:-.4em;font-weight:700}
#welcome p{color:var(--dim);font-size:.82rem;max-width:380px;line-height:1.7}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px;width:min(520px,100%)}
.card{padding:16px;border-radius:22px;text-align:left;font-size:.78rem;line-height:1.5;color:var(--ink);transition:transform .2s}
.card:hover{transform:translateY(-2px)}.card b{display:block;font-size:.82rem;margin-bottom:4px}.card span{color:var(--dim)}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);padding:9px 18px;border-radius:999px;font-size:.74rem;opacity:0;pointer-events:none;transition:.3s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#app{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#chat{padding-inline:max(14px,calc((100% - 880px)/2))}
#runner.open{min-width:360px}
@media(min-width:1200px){.bubble{font-size:.94rem}.prompt-bar{width:min(820px,100%)}#header{margin:14px 16px 0}}
@media(min-width:1600px){html{font-size:17px}}
@media(min-width:2200px){html{font-size:19px}}
@media(max-width:1023px){
  #runner{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(94vw,680px)!important;min-width:0!important;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  #runner.open{transform:none}.run-in{margin:10px}
}
@media(max-width:700px){
  #runner{width:100%!important;box-shadow:none}
  .cards{grid-template-columns:1fr}.msg{max-width:94%}#status span{display:none}#header{margin:8px 8px 0}#chat{padding-top:12px}
}
@media(pointer:coarse){.pb-tool,.pb-send{min-width:38px;height:38px}.ibtn{width:42px;height:42px}}
@media(max-height:500px) and (orientation:landscape){#header{margin:6px 10px 0;padding:4px 6px}.ibtn{width:34px;height:34px}.cards,#welcome p{display:none}#welcome h1{font-size:1.6rem}.pb-menu{max-height:60vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* VoicePill */
.voice-pill{position:relative;flex:none;width:var(--vp-size);height:var(--vp-size);padding:0;border:0;background:none;color:var(--vp-icon);cursor:pointer;outline:none;touch-action:none;user-select:none;-webkit-user-select:none;z-index:2;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.voice-pill[data-pressed]{transform:scale(var(--vp-press))}.voice-pill:disabled{opacity:.35;cursor:not-allowed}
.voice-pill__capsule{position:absolute;top:0;right:0;height:100%;width:var(--vp-size);border-radius:var(--vp-radius);background:transparent;border:1px solid transparent;transition:width var(--vp-open) cubic-bezier(.23,1,.32,1),background-color .2s,border-color .2s}
.voice-pill:hover:not(:disabled) .voice-pill__capsule{background:rgba(255,255,255,.1)}
.voice-pill[data-state=listening] .voice-pill__capsule{width:calc(var(--vp-size) + var(--vp-extra));background:var(--vp-bg);border-color:rgba(255,255,255,.14)}
.voice-pill__glyph{position:absolute;right:0;top:0;width:var(--vp-size);height:var(--vp-size);display:grid;place-items:center;transform:translateX(var(--vp-slide,0px))}
.voice-pill[data-sliding] .voice-pill__glyph{transition:none}
.voice-pill__mic,.voice-pill__stop{grid-area:1/1;transition:opacity .15s,transform var(--vp-open) cubic-bezier(.23,1,.32,1)}
.voice-pill__mic{display:grid;color:var(--vp-icon)}
.voice-pill__stop{width:var(--vp-stop);height:var(--vp-stop);border-radius:3px;background:var(--vp-accent);opacity:0;transform:scale(.5)}
.voice-pill[data-state=listening] .voice-pill__mic{opacity:0;transform:scale(.5)}
.voice-pill[data-state=listening] .voice-pill__stop{opacity:1;transform:none}
.voice-pill__time{position:absolute;right:var(--vp-size);top:0;height:100%;width:var(--vp-clock-w);display:flex;align-items:center;justify-content:center;font-size:var(--vp-time-size);font-variant-numeric:tabular-nums;color:var(--vp-accent);opacity:0;transition:opacity .15s}
.voice-pill__wave{position:absolute;right:calc(var(--vp-size) + var(--vp-clock-w));top:0;width:var(--vp-wave-w);height:100%;opacity:0;transition:opacity .15s}
.voice-pill[data-state=listening] .voice-pill__time,.voice-pill[data-state=listening] .voice-pill__wave{opacity:calc(1 - var(--vp-cancel,0));transition-delay:.08s}
.voice-pill__cancel{position:absolute;right:calc(var(--vp-extra) + var(--vp-size) - 76px);top:0;height:100%;display:flex;align-items:center;gap:2px;font-size:12px;color:var(--vp-accent);opacity:var(--vp-cancel,0);white-space:nowrap;pointer-events:none}

.thinking{padding:6px 18px 6px 8px}
.cr-row{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;color:var(--dim)}
.cr-wrap{position:relative;width:64px;height:64px;flex:none}
.cr-loader{position:absolute;left:0;top:0;width:200px;height:200px;perspective:800px;transform:scale(.32);transform-origin:0 0}
.cr-crystal{position:absolute;top:50%;left:50%;width:60px;height:60px;opacity:0;transform-origin:bottom center;transform:translate(-50%,-50%) rotateX(45deg) rotateZ(0deg);animation:crSpin 4s linear infinite,crEmerge 2s ease-in-out infinite alternate,crFade .3s ease-out forwards;border-radius:10px;visibility:hidden}
@keyframes crSpin{from{transform:translate(-50%,-50%) rotateX(45deg) rotateZ(0deg)}to{transform:translate(-50%,-50%) rotateX(45deg) rotateZ(360deg)}}
@keyframes crEmerge{0%,100%{transform:translate(-50%,-50%) scale(.5);opacity:0}50%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes crFade{to{visibility:visible;opacity:.8}}
.cr-crystal:nth-child(1){background:linear-gradient(45deg,#003366,#336699);animation-delay:0s}
.cr-crystal:nth-child(2){background:linear-gradient(45deg,#003399,#3366cc);animation-delay:.3s}
.cr-crystal:nth-child(3){background:linear-gradient(45deg,#0066cc,#3399ff);animation-delay:.6s}
.cr-crystal:nth-child(4){background:linear-gradient(45deg,#0099ff,#66ccff);animation-delay:.9s}
.cr-crystal:nth-child(5){background:linear-gradient(45deg,#33ccff,#99ccff);animation-delay:1.2s}
.cr-crystal:nth-child(6){background:linear-gradient(45deg,#66ffff,#ccffff);animation-delay:1.5s}
@media(prefers-reduced-motion:reduce){.cr-crystal{visibility:visible;opacity:.8}}
.pb-menu[data-kind=plus]{right:auto;width:min(440px,100%);padding:12px}
.pb-sh-head{position:relative;display:flex;align-items:center;justify-content:center;height:44px;margin-bottom:12px;font-weight:600;font-size:.95rem}
.pb-sh-x{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--ink)}

const COMMON=`
float hash12(vec2 p){
  vec3 q=fract(vec3(p.xyx)*0.1031);
  q+=dot(q,q.yzx+33.33);
  return fract((q.x+q.y)*q.z);
}
`;
const FIELD=`#version 300 es
precision highp float;
precision highp int;
uniform float uAspect;uniform float uTime;uniform int uShape;uniform vec3 uRamp[8];uniform int uCount;
uniform float uScale;uniform float uSoftness;uniform float uFlow;uniform vec2 uSeed;uniform vec4 uTrail[24];
uniform float uRadius;uniform vec4 uClicks[4];uniform int uClickEffect;uniform float uIntro;uniform float uFrame;
in vec2 vUv;
layout(location=0) out vec4 outColor;
layout(location=1) out vec4 outAux;
${COMMON}
vec2 hash22(vec2 p){
  vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.103,0.0973));
  q+=dot(q,q.yzx+33.33);
  return fract((q.xx+q.yz)*q.zy)*2.0-1.0;
}
float noise(vec2 p){
  vec2 i=floor(p);vec2 f=fract(p);
  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);
  float a=dot(hash22(i),f);
  float b=dot(hash22(i+vec2(1.0,0.0)),f-vec2(1.0,0.0));
  float c=dot(hash22(i+vec2(0.0,1.0)),f-vec2(0.0,1.0));
  float d=dot(hash22(i+vec2(1.0,1.0)),f-vec2(1.0,1.0));
  return 0.5+0.5*mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
vec3 labToRgb(vec3 lab){
  float l=lab.x+0.3963377774*lab.y+0.2158037573*lab.z;
  float m=lab.x-0.1055613458*lab.y-0.0638541728*lab.z;
  float s=lab.x-0.0894841775*lab.y-1.2914855480*lab.z;
  l=l*l*l;m=m*m*m;s=s*s*s;
  return vec3(4.0767416621*l-3.3077115913*m+0.2309699292*s,-1.2684380046*l+2.6097574011*m-0.3413193965*s,-0.0041960863*l-0.7034186147*m+1.7076147010*s);
}
vec3 encode(vec3 c){
  c=clamp(c,0.0,1.0);
  return mix(c*12.92,1.055*pow(c,vec3(1.0/2.4))-0.055,step(0.0031308,c));
}
vec3 horizon(vec2 p,float time,out float order){
  float span=0.5*max(uAspect,1.0);
  float x=p.x/span;
  float arch=-0.17-0.2*x*x+0.02*sin(time*0.6);
  float soft=mix(0.05,0.22,uSoftness);
  float edge=p.y-arch;
  float rim=0.38*smoothstep(-soft,0.42,edge);
  vec2 sun=vec2(0.08*sin(time*0.31)*span,0.58);
  float spread=length((p-sun)/vec2(0.95*span,0.75));
  float sky=mix(0.55,1.0,smoothstep(0.2,0.95,spread));
  order=clamp(edge*1.3,0.0,1.0);
  return vec3(rim,sky,smoothstep(0.18,0.62,edge));
}
vec3 pinch(vec2 p,float time,out float order){
  float span=0.5*max(uAspect,0.75);
  float x=p.x/span;
  float sway=0.02*sin(x*1.7+time*0.55);
  float breathe=1.0+0.06*sin(time*0.8);
  float width=(0.13+0.22*x*x)*breathe*mix(0.85,1.2,uSoftness);
  float y=abs(p.y-sway)/width;
  float t=exp(-pow(y,2.2))*(0.42+0.58*exp(-x*x*1.8));
  order=clamp(abs(p.y-sway)*2.4+abs(x)*0.3,0.0,1.0);
  return vec3(t,t,0.0);
}
vec3 rise(vec2 p,float time,out float order){
  float wide=max(uAspect,0.9);
  vec2 center=vec2(0.05*sin(time*0.45)*wide,-0.7);
  vec2 radius=vec2(0.82*wide,0.64*(1.0+0.04*sin(time*0.8)));
  float d=length((p-center)/radius);
  float soft=mix(0.6,1.15,uSoftness);
  float t=clamp(pow(clamp(1.0-d,0.0,1.0),soft)*1.35,0.0,1.0);
  order=clamp((d-0.2)*1.3,0.0,1.0);
  return vec3(t,t,0.0);
}
vec3 eclipse(vec2 p,float time,out float order){
  float fit=min(1.0,uAspect*1.25);
  float r=0.23*fit*(1.0+0.015*sin(time*0.9));
  float angle=atan(p.y,p.x);
  float rays=noise(vec2(cos(angle),sin(angle))*2.2+time*0.08)*0.8+0.6;
  float d=length(p)-r;
  float reach=mix(0.07,0.15,uSoftness)*rays*fit;
  float t=smoothstep(-0.006,0.006+0.02*uSoftness,d)*exp(-max(d,0.0)/reach);
  order=clamp(d*2.0,0.0,1.0);
  return vec3(t,t,0.0);
}
vec4 tone(float t){
  float x=smoothstep(0.3,1.0,t)*float(uCount-1);
  int index=int(floor(x));
  return vec4(mix(uRamp[index],uRamp[min(index+1,uCount-1)],fract(x)),smoothstep(0.0,0.38,t));
}
void main(){
  vec2 p=(vUv-0.5)*vec2(uAspect,1.0);
  float time=uTime;
  vec2 q=p/uScale;
  vec2 warp=vec2(noise(q*1.6+uSeed+vec2(0.0,time*0.3)),noise(q*1.6+uSeed.yx+vec2(4.3,-time*0.24)))-0.5;
  q+=warp*uFlow*(uShape==3?0.04:0.18);
  float order=0.0;
  vec3 shape;
  if(uShape==0)shape=horizon(q,time,order);
  else if(uShape==1)shape=pinch(q,time,order);
  else if(uShape==2)shape=rise(q,time,order);
  else shape=eclipse(q,time,order);
  float reveal=clamp((uIntro*1.45-order)/0.45,0.0,1.0);
  reveal=reveal*reveal*(3.0-2.0*reveal);
  float scramble=0.0;
  for(int i=0;i<24;i++){
    vec4 point=uTrail[i];
    if(point.z<=0.0)continue;
    vec2 d=p-point.xy;
    scramble=max(scramble,point.z*exp(-dot(d,d)/(uRadius*uRadius)));

  for(int i=0;i<4;i++){
    vec4 c=uClicks[i];
    if(c.w<=0.0)continue;

    }else if(uClickEffect==2){

      scramble=max(scramble,(1.0-smoothstep(size*0.6,size,d))*c.w);

  vec2 t=clamp(shape.xy*mix(0.7,1.0,reveal),0.0,1.0);
  vec4 mixed=mix(tone(t.x),tone(t.y),shape.z);
  vec3 color=encode(labToRgb(mixed.rgb));
  float alpha=mixed.a*reveal;

  outColor=clamp(vec4(color*alpha+dither,alpha+dither),0.0,1.0);
  outAux=vec4(reveal,scramble,0.0,1.0);
}`;
const GLYPHS=`
uniform sampler2D uField;uniform sampler2D uAux;uniform sampler2D uAtlas;
uniform vec2 uResolution;uniform vec2 uCell;uniform vec2 uOffset;uniform vec2 uAtlasGrid;
uniform float uCount;uniform float uDensity;uniform float uOpacity;uniform float uFlicker;uniform float uDepth;
uniform float uGlyphTime;uniform float uSeedValue;uniform float uLight;
${COMMON}
float sampleGlyph(float index,vec2 local,vec2 coord,float soft){
  float column=mod(index,uAtlasGrid.x);
  float row=floor(index/uAtlasGrid.x);
  vec2 atlasUv=vec2((column+local.x)/uAtlasGrid.x,(row+1.0-local.y)/uAtlasGrid.y);
  vec2 continuous=coord/uAtlasGrid;
  float scale=exp2(soft);
  return textureGrad(uAtlas,atlasUv,dFdx(continuous)*scale,dFdy(continuous)*scale).a;
}
vec4 glyphAt(vec2 px){
  vec2 coord=(px-uOffset)/uCell;
  vec2 cell=floor(coord);
  vec2 local=coord-cell;
  vec2 uv=clamp(((cell+0.5)*uCell+uOffset)/uResolution,vec2(0.0),vec2(1.0));
  vec4 field=texture(uField,uv);
  vec4 aux=texture(uAux,uv);
  vec3 visible=uLight>0.5?field.rgb+(1.0-field.a):field.rgb;
  float luma=dot(visible,vec3(0.2126,0.7152,0.0722));
  float value=uLight>0.5?clamp((1.0-luma)*1.5,0.0,1.0):luma;
  float pick=hash12(cell+uSeedValue*7.31);
  float level=hash12(cell*1.73+4.1+uSeedValue);
  float tick=floor(uGlyphTime*9.0+level*9.0);
  float wobble=(hash12(cell*2.31+tick*17.7)-0.5)*uFlicker*0.4+(level-0.5)*0.1;
  float tone=clamp(pow(value,0.75)+wobble,0.0,1.0);
  float index=floor(tone*(uCount-1.0)+0.5);
  float decode=max(aux.g,1.0-aux.r);
  if(decode>0.02){
    float frame=floor(uGlyphTime*20.0);
    if(hash12(cell*3.7+frame*5.3)<decode*1.25)index=1.0+floor(hash12(cell+frame*1.37)*(uCount-1.0));
  }
  float present=step(pick,uDensity*mix(1.0,0.3+tone*1.1,0.55));
  float cutoff=smoothstep(0.03,0.1,value);
  float focus=step(hash12(cell*0.71+9.2+uSeedValue),uDepth);
  float coverage=sampleGlyph(index,local,coord,focus*1.2);
  float alpha=uOpacity*present*cutoff*coverage*mix(1.0,0.35+0.65*level,0.55)*(1.0-focus*0.5);
  if(uLight<0.5){
    vec3 light=field.rgb*0.55+vec3(0.03)*field.a;
    return vec4(light*alpha,0.6*field.a*alpha);
  }
  vec3 ink=visible*0.8;
  return vec4(ink*alpha,alpha);
}
`;

const COMPOSITE=`#version 300 es
precision highp float;
uniform sampler2D uHalo;uniform float uGlow;uniform float uGradient;uniform float uGrain;uniform float uFrame;
in vec2 vUv;
out vec4 outColor;
${GLYPHS}
void main(){
  vec4 base=texture(uField,vUv)*uGradient;
  vec4 glyph=glyphAt(gl_FragCoord.xy);
  vec4 halo=texture(uHalo,vUv)*uGlow;
  vec4 color;
  if(uLight<0.5){color=base+glyph+halo;}
  else{color=glyph+base*(1.0-glyph.a);color+=halo*0.6*(1.0-color.a);}
  float grain=(hash12(gl_FragCoord.xy+uFrame*vec2(17.0,59.0))+hash12(gl_FragCoord.xy*1.31+uFrame*7.0)-1.0)*uGrain;
  float body=clamp(color.a,0.0,1.0);
  color.rgb+=grain*(0.25+body)*0.5;
  color.a=clamp(color.a,0.0,1.0);
  color.rgb=clamp(color.rgb,0.0,color.a);
  outColor=color;
}`;

const toLinear=v=>(v<=0.04045?v/12.92:((v+0.055)/1.055)**2.4);
const toLab=([r,g,b])=>{

  const m=Math.cbrt(0.2119034982*lr+0.6806995451*lg+0.1073969566*lb);
  const s=Math.cbrt(0.0883024619*lr+0.2817188376*lg+0.6299787005*lb);
  return [0.2104542553*l+0.793617785*m-0.0040720468*s,1.9779984951*l-2.428592205*m+0.4505937099*s,0.0259040371*l+0.7827717662*m-0.808675766*s];
};

const Strands=(function(){
  const cv=$('strands'),x=cv.getContext('2d');let on=false,lvl=0,target=0,analyser=null,buf=null,stream=null,ctx=null;
  function size(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;}
  addEventListener('resize',size);
  function draw(t){
    if(!on)return;
    if(analyser){analyser.getByteFrequencyData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i];target=Math.min(1,s/buf.length/90);}
    else target=.35+.25*Math.sin(t/400);

    for(let i=0;i<7;i++){
      x.beginPath();

        const n=px/w,env=Math.sin(n*Math.PI);
        const y=h/2+Math.sin(n*9+t/700*(1+i*.18)+i)*h*.22*env*(.15+lvl*1.1)*(1-i*.07);

        const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();

        buf=new Uint8Array(analyser.frequencyBinCount);

    },

      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
      if(ctx){ctx.close();ctx=null;}analyser=null;}
  };
})();

}

/* ═════ SEND / API ═════ */
async function sendMessage(){
  const input=$('input'),text=input.value.trim();
  if((!text&&!attachedFiles.length)||isThinking)return;
  if(attachedFiles.some(f=>f.isText&&!f.loaded))return showToast('Still reading files…');
  const full=buildAttachmentContext()+(text||'(see attached file(s))');
  const names=attachedFiles.map(f=>f.name);
  input.value='';autoResize(input);$('welcome')?.remove();
  if(matchMedia('(pointer:coarse)').matches)input.blur();
  const shown=names.length?`${text?text+'\n\n':''}📎 ${names.join(', ')}`:text;
  addMessage('user',shown,full);
  attachedFiles=[];renderAttachments();
  await callAI(full);
}
function quickPrompt(t){$('input').value=t;sendMessage();}

async function callAI(prompt){
  isThinking=true;$('mic').disabled=true;setBusy(true);setStatus('Thinking');ctl=new AbortController();
  const box=document.createElement('div');box.className='thinking glass';
  const lat=crystalLoader();box.appendChild(lat);$('chat').appendChild(box);lat.start();scrollDown();
  const t0=Date.now(),secs=()=>((Date.now()-t0)/1000).toFixed(1);
  try{
    const resp=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      signal:ctl.signal,body:JSON.stringify({message:prompt,systemPrompt:getSystemPrompt()})});
    lat.stop();box.remove();
    if(!resp.ok){
      const err=await resp.json().catch(()=>({}));
      addMessage('assistant','⚠ API error: '+(err?.message||err?.error||'HTTP '+resp.status),null,{error:true,time:secs()});
    }else{
      const data=await resp.json();
      const text=typeof data==='string'?data:(data.text||data.message||JSON.stringify(data));
      addMessage('assistant',text,null,{time:secs()});
      let html=extractHtml(text);
      if(!html){const um=[...msgs].reverse().find(m=>m.role==='user');if(um)html=extractHtml(um.full);}
      if(html)runHtml(html);
    }
  }catch(e){lat.stop();box.remove();if(e.name==='AbortError')showToast('Stopped');else addMessage('assistant','⚠ Connection error: '+e.message,null,{error:true,time:secs()});}
  isThinking=false;$('mic').disabled=false;setBusy(false);setStatus('Online');
}

/* long-press / right-click menu */
function bindPress(d){
  let timer=null,sx=0,sy=0;
  const b=d.querySelector('.bubble');
  const start=e=>{
    if(e.target.closest('button,pre,textarea,a'))return;
    const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;d.classList.add('pressing');
    timer=setTimeout(()=>{d.classList.remove('pressing');if(navigator.vibrate)navigator.vibrate(12);openMenu(d,sx,sy);},450);
  };
  const cancel=()=>{clearTimeout(timer);d.classList.remove('pressing');};
  const move=e=>{const p=e.touches?e.touches[0]:e;if(Math.abs(p.clientX-sx)>8||Math.abs(p.clientY-sy)>8)cancel();};
  b.addEventListener('touchstart',start,{passive:true});b.addEventListener('touchmove',move,{passive:true});
  b.addEventListener('touchend',cancel);b.addEventListener('touchcancel',cancel);
  b.addEventListener('mousedown',start);b.addEventListener('mousemove',move);b.addEventListener('mouseup',cancel);b.addEventListener('mouseleave',cancel);

    const h=extractHtml(m.content);if(h)items.push(['▶ Run HTML',()=>runHtml(h)]);}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderMarkdown(text){
  const blocks=[];
  let t=text.replace(/```(\w+)?\n?([\s\S]*?)```/g,(_,lang,code)=>{
    const id='c'+Math.random().toString(36).slice(2),l=(lang||'txt').toLowerCase(),raw=code.replace(/^\n+|\n+$/g,'');
    codeStore[id]=raw;
    blocks.push(`<div class="code-wrap"><div class="code-bar">${l==='html'?`<button class="run" onclick="runBlock('${id}')">▶ Run</button>`:''}<button onclick="copyCode('${id}',this)">Copy</button><button onclick="downloadCode('${id}','${l}')">Save</button></div><pre><code>${escHtml(raw)}</code></pre></div>`);
    return `@@BLOCK${blocks.length-1}@@`;
  });
  let h=escHtml(t);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
   .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
   .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^---$/gm,'<hr>').replace(/^[\*\-] (.+)$/gm,'<li>$1</li>').replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
   .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  blocks.forEach((b,i)=>{h=h.replace(`@@BLOCK${i}@@`,()=>b);});
  return h;
}

}

function VoicePill(el,o){

  el.innerHTML=`<span class="voice-pill__capsule"></span>${O.waveform?'<canvas class="voice-pill__wave"></canvas>':''}${O.slideToCancel?'<span class="voice-pill__cancel">‹ Cancel</span>':''}${O.showTime?'<span class="voice-pill__time">0:00</span>':''}<span class="voice-pill__glyph"><span class="voice-pill__mic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><span class="voice-pill__stop"></span></span>`;

    if(s.own){if(isHold)end('release');}else end(held<O.holdAfter?'tap':'release');
  };
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,up));
  el.addEventListener('keydown',e=>{
    if(e.key==='Escape'){end('escape');return;}
    if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();s.listening?end('key'):begin();}
  });
  el.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('blur',()=>{if(s.pid!==null)end('blur');});
  return {end,setDisabled(b){el.disabled=b;if(b)end('disabled');}};
}

/* ═════ VOICE INPUT (speech recognition driven by the pill) ═════ */
function initRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  const r=new SR();r.continuous=false;r.interimResults=true;r.lang='en-US';
  r.onstart=()=>{isRecording=true;setStatus('Listening');$('voice-text').textContent='Listening…';Strands.start();};
  r.onresult=e=>{let f='',i2='';
    for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;e.results[i].isFinal?f+=t:i2+=t;}
    $('input').value=(f||i2).trim();autoResize($('input'));$('voice-text').textContent=$('input').value||'Listening…';if(f)r._final=true;};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')showToast('Mic access denied');else if(e.error!=='no-speech'&&e.error!=='aborted')showToast('Voice error: '+e.error);};
  r.onend=()=>{
    isRecording=false;Strands.stop();if(!isThinking)setStatus('Online');voicePill.end('speech-end');
    if(r._cancel){r._cancel=false;r._final=false;$('input').value='';autoResize($('input'));return;}
    if(r._final&&$('input').value.trim()){r._final=false;sendMessage();}
  };
  return r;
}
const voicePill=VoicePill($('mic'),{
  onStart(){
    if(!recognition)recognition=initRecognition();
    if(!recognition){showToast('Voice input not supported here');setTimeout(()=>voicePill.end('unsupported'),0);return;}
    try{$('input').value='';autoResize($('input'));recognition._cancel=false;recognition.start();}catch(e){}
  },
  onStop({reason}){
    if(!recognition)return;
    if(reason==='cancel'||reason==='escape'){recognition._cancel=true;try{recognition.abort();}catch(e){}}
    else{try{recognition.stop();}catch(e){}}
  }
});


/* ═════ VOICE OUTPUT ═════ */
function pickVoice(){
  const v=speechSynthesis.getVoices();if(!v.length)return null;
  const tests=[x=>/Daniel/i.test(x.name)&&/en-GB/i.test(x.lang),x=>/Google UK English Male/i.test(x.name),x=>/Microsoft Ryan/i.test(x.name),x=>/en-GB/i.test(x.lang),x=>/male/i.test(x.name)&&/en/i.test(x.lang)];
  for(const t of tests){const m=v.find(t);if(m)return m;}return v[0];
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{jarvisVoice=pickVoice();};jarvisVoice=pickVoice();}
function stripForSpeech(t){return t.replace(/```[\s\S]*?```/g,' Code block omitted. ').replace(/`([^`]+)`/g,'$1').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[*_#>~]/g,'').replace(/^\s*[-•]\s+/gm,'').replace(/\n{2,}/g,'. ').replace(/\n/g,' ').trim();}
function stopSpeaking(){
  if(currentAudioSource){try{currentAudioSource.stop();}catch(e){}currentAudioSource=null;}
  if('speechSynthesis' in window)speechSynthesis.cancel();
}
async function speakText(text){
  stopSpeaking();const clean=stripForSpeech(text);if(!clean)return;
  if(ELEVENLABS_API_KEY&&ELEVENLABS_API_KEY!=="YOUR_ELEVENLABS_API_KEY"){
    try{
      const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}`,{method:'POST',headers:{'Content-Type':'application/json','xi-api-key':ELEVENLABS_API_KEY},
        body:JSON.stringify({text:clean,model_id:"eleven_monolingual_v1",voice_settings:{stability:.5,similarity_boost:.85}})});
      if(!r.ok)throw new Error('ElevenLabs request failed');
      if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const src=audioCtx.createBufferSource();src.buffer=await audioCtx.decodeAudioData(await r.arrayBuffer());
      src.connect(audioCtx.destination);src.onended=()=>{currentAudioSource=null;};currentAudioSource=src;src.start(0);return;
    }catch(e){console.warn('ElevenLabs failed, using local voice',e);}
  }
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(clean);if(!jarvisVoice)jarvisVoice=pickVoice();if(jarvisVoice)u.voice=jarvisVoice;
    u.pitch=.8;u.rate=.95;speechSynthesis.speak(u);
  }else showToast('Voice output not supported');
}
function toggleAutoVoice(){
  autoVoiceMode=!autoVoiceMode;const s=$('voice-sw');
  s.classList.toggle('on',autoVoiceMode);s.setAttribute('aria-checked',autoVoiceMode);
  if(!autoVoiceMode)stopSpeaking();showToast(autoVoiceMode?'Auto voice on':'Auto voice off');
}
